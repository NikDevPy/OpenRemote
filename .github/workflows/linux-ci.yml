name: Linux CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Linux Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install agent and test requirements
        run: python -m pip install .
      - name: Run suite
        run: python -m unittest discover -s tests -q
      - name: Verify CLI entry point
        run: openremote-agent --help
  gui:
    name: Linux Qt offscreen smoke (optional GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install optional GUI
        run: python -m pip install '.[gui]'
      - name: Render/interaction smoke without display
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.test_gui_ui tests.test_wizard_ui -v
      - name: Verify GUI launcher
        env:
          QT_QPA_PLATFORM: offscreen
        run: openremote-gui --help

  package:
    name: Linux packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Check metadata and LICENSE are included
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          tarballs = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1 and len(tarballs) == 1
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
              assert any(n.endswith("/LICENSE") for n in names)
              assert "openremote_agent/server.py" in names
              assert "openremote_agent/coordination.py" in names
              assert "openremote_gui/app.py" in names
          assert "openremote_gui/onboarding.py" in names
          assert "openremote_gui/wizard.py" in names
          assert "openremote_gui/assets/openremote.svg" in names
          with tarfile.open(tarballs[0], "r:gz") as sdist:
              names = sdist.getnames()
              assert any(n.endswith("/LICENSE") for n in names)
          print("Linux package smoke checks passed")
          PY
      - name: Upload Linux-built Python distributions (CI only)
        uses: actions/upload-artifact@v4
        with:
          name: openremote-python-dist-linux-built
          path: dist/*

  deb-preview:
    name: Debian amd64 preview package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated builder
        run: python -m pip install build
      - name: Build Debian installer
        env:
          OPENREMOTE_BUILD_PYTHON: python
        run: bash scripts/build_linux_deb.sh dist
      - name: Verify package contents without installing as root
        run: |
          deb=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb -I "$deb"
          mkdir -p /tmp/openremote-extract
          dpkg-deb -x "$deb" /tmp/openremote-extract
          test -x /tmp/openremote-extract/usr/bin/openremote-control-center
          test -f /tmp/openremote-extract/usr/share/applications/openremote-control-center.desktop
          test -f /tmp/openremote-extract/usr/share/icons/hicolor/scalable/apps/openremote-control-center.svg
          bash -n /tmp/openremote-extract/usr/bin/openremote-control-center
      - name: Upload experimental Debian package
        uses: actions/upload-artifact@v4
        with:
          name: openremote-deb-linux-amd64-preview
          path: dist/*.deb
