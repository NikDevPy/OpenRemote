[project]
name = "openremote-probe"
version = "0.3.1"
description = "MCP проба и ограниченный безопасный SSH агент OpenRemote"
requires-python = ">=3.11"
dependencies = ["mcp==1.29.0", "uvicorn>=0.35,<1"]

[project.scripts]
openremote-probe = "openremote_probe.server:main"
openremote-agent = "openremote_agent.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openremote_probe*", "openremote_agent*"]
